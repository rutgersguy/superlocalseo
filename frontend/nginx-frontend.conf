server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip for text assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Fingerprinted build assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML entrypoint, so a new deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: serve index.html for any client-side route.
    # NOTE: /api and /webhooks are routed to the API by the OUTER reverse proxy
    # (n8n-nginx) and never reach this container, so no API proxy is needed here.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
