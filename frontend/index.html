    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Your customers are asking AI who to call. Does it say your name?" />
    <meta name="twitter:description" content="See whether ChatGPT, Claude, Gemini and Perplexity recommend your business. Free report, no card." />

    <!-- JSON-LD.
         The prices below are NOT React and are derived from nothing — they must
         be changed by hand whenever PRICING.md changes. The retired $350-$1200
         tiers were served to Google from this file for months (#153). Keep them
         in step with PRICING in src/pages/Landing.tsx.
         Do not add comments INSIDE the script block: JSON-LD is JSON, and a
         comment silently invalidates the whole structured-data blob. -->
    <!-- JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "SuperLocalSEO",
      "applicationCategory": "BusinessApplication",
      "description": "Tracks whether AI assistants recommend a local service business, alongside Google rankings, reviews and directory listings. For plumbing, HVAC, electrical and roofing companies.",
      "url": "https://superlocalseo.com",
      "offers": {
        "@type": "AggregateOffer",
        "lowPrice": "149",
        "highPrice": "349",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
