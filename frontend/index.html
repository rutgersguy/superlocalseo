<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sls-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperLocalSEO — Your online visibility. One clear picture.</title>
    <meta name="description" content="Google rankings, customer reviews and AI mentions — tracked regularly and summarized every month. Visibility monitoring for home service businesses. Plans from $149/month. Check your business free." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://superlocalseo.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://superlocalseo.com/" />
    <meta property="og:title" content="Your online visibility. One clear picture." />
    <meta property="og:description" content="Google rankings, customer reviews and AI mentions — tracked regularly and summarized every month. Built for home service businesses. Check your business free." />
    <meta property="og:site_name" content="SuperLocalSEO" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Your online visibility. One clear picture." />
    <meta name="twitter:description" content="Google rankings, customer reviews and AI mentions in one clear monthly picture. Visibility monitoring for home service businesses." />

    <!-- JSON-LD.
         The prices below are NOT React and are derived from nothing — they must
         be changed by hand whenever PRICING.md changes. The retired $350-$1200
         tiers were served to Google from this file for months (#153). Keep them
         in step with PRICING in src/pages/Landing.tsx.
         Do not add comments INSIDE the script block: JSON-LD is JSON, and a
         comment silently invalidates the whole structured-data blob. -->
    <!-- JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "SuperLocalSEO",
      "applicationCategory": "BusinessApplication",
      "description": "Tracks whether AI assistants recommend a local service business, alongside Google rankings, reviews and directory listings. For plumbing, HVAC, electrical and roofing companies.",
      "url": "https://superlocalseo.com",
      "offers": {
        "@type": "AggregateOffer",
        "lowPrice": "149",
        "highPrice": "349",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
