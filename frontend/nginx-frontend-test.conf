# Frontend nginx for the ISOLATED TEST STACK (issue #159).
#
# Identical to nginx-frontend.conf except that it proxies /api and /webhooks to
# the test API container. In production those are routed by the OUTER reverse
# proxy (n8n-nginx) and never reach this container — which is exactly why the
# e2e suite was unrunnable against localhost for five weeks (see tests/e2e/config.ts).
#
# Proxying here makes the test stack self-contained: one origin serves both the
# SPA and the API, so E2E_BASE_URL can point at localhost with no external
# dependency, and the suite no longer has to run against production.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The test-only difference: same-origin API.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /webhooks/ {
        proxy_pass http://api:3000/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
