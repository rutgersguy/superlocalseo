upstream api {
    server api:3000;
}

upstream web {
    server web:5173;
}

server {
    listen 80;
    server_name superlocalseo.com www.superlocalseo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name superlocalseo.com www.superlocalseo.com;

    ssl_certificate     /etc/letsencrypt/live/superlocalseo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/superlocalseo.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    # API
    location /api/ {
        proxy_pass http://api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stripe webhooks (raw body)
    location /webhooks/ {
        proxy_pass http://api/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA — everything else goes to the frontend
    location / {
        proxy_pass http://web/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
