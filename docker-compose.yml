# Docker's default json-file driver is UNBOUNDED — container logs grow until the
# disk does. Across this host they had reached 478MB with no ceiling.
#
# Also worth knowing: Docker deletes a container's logs when it is RECREATED, so
# these files are not an error archive. With SENTRY_DSN empty, every deploy
# destroys the API's error history. Rotation caps the disk risk; it does not
# solve observability. See .env.example (SENTRY_DSN).
#
# Applies on next `up -d --force-recreate <service>` — it is not retroactive.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:15-alpine
    container_name: superlocalseo-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: superlocalseo
      POSTGRES_USER: slseo
      POSTGRES_PASSWORD: slseo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slseo -d superlocalseo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: superlocalseo-redis
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:6399:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      # Production build: `tsc` to dist/, run with `node dist/index.js`.
      # backend/src is deliberately NOT bind-mounted — it used to be, which made
      # every save to a source file an instant production deploy, and a save that
      # didn't compile 504'd the live API (issue #131, fired 2026-07-13).
      #
      # Deploy is now explicit and gated by the build:
      #   docker compose build api && docker compose up -d --no-deps api
      # A broken file fails `build` and never reaches the running container.
      #
      # Local dev with hot reload: add the override explicitly.
      #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d api
      # It is NOT named docker-compose.override.yml on purpose — compose loads
      # that automatically, which would silently put this host back into dev mode.
      target: production
    container_name: superlocalseo-api
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3000:3000"
    volumes:
      - reports_data:/app/data/reports
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://slseo:slseo@postgres:5432/superlocalseo
      - REDIS_URL=redis://redis:6379
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      # Production build: `vite build` served as static files by nginx (SPA fallback in
      # frontend/nginx-frontend.conf). No dev server, no source exposure, no error overlay.
      # Deploy = `docker compose build web && docker compose up -d web` (rebuild, not restart).
      target: production
    container_name: superlocalseo-web
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pg_data:
  redis_data:
  reports_data:
